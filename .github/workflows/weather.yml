name: 每日英国天气推送

on:
  schedule:
    # GitHub Actions cron 使用 UTC 时间
    # 英国夏令时(BST, UTC+1)早上8点 = UTC 7点
    # 英国冬令时(GMT, UTC+0)早上8点 = UTC 8点
    # 两个时间点都设，确保冬夏都是英国8点推送
    - cron: "0 7 * * *"   # 夏令时 = 英国8:00
    - cron: "0 8 * * *"   # 冬令时 = 英国8:00
  workflow_dispatch:       # 允许手动触发测试

jobs:
  send-weather:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 发送天气推送
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: python weather.py
